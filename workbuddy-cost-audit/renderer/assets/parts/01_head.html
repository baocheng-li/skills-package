/* 表体分隔线在浅色下要更实一点，否则网格背景会把行读串 */
[data-skin="light"] .tbl tbody td{border-bottom-color:rgba(43,58,85,.075)}
[data-skin="light"] .card{box-shadow:0 8px 24px rgba(56,86,120,.10),0 1px 0 #fff inset}
/* 浅色主题下玻璃背后是浅灰蓝，网格线要压淡，否则像方格纸 */
[data-skin="light"] .holo-grid{opacity:.7}

/* 分页控制器 */
.pager{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-top:1px solid var(--line);font-size:11px;color:var(--text3)}
.pg-info{margin-right:auto}
.pg-btns{display:flex;align-items:center;gap:4px}
.pg{min-width:26px;height:26px;padding:0 7px;border-radius:7px;border:1px solid var(--line2);
  background:rgba(var(--ink),.05);color:var(--text2);font:inherit;font-size:11px;cursor:pointer}
.pg:hover:not(:disabled){background:rgba(var(--pri),.16);color:var(--info-12);border-color:rgba(var(--pri),.35)}
.pg.on{background:rgba(var(--pri),.24);border-color:rgba(var(--pri),.45);color:var(--info-12);font-weight:600}
.pg:disabled{opacity:.35;cursor:not-allowed}
.pg-dot{color:var(--text3);padding:0 2px}

/* ---------- 小按钮 / 行选中 / 步骤面板 ---------- */
.btn.xs{height:22px;padding:0 8px;font-size:10.5px;border-radius:6px}
.btn.sp{padding:0 10px}
.tbl tr.sel{background:rgba(var(--pri),.10)}
.tbl tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
/* 执行明细面板：贴着主表下方展开，与主表同一张「纸」，不另起一张卡 */
.cr-steps{border:1px solid rgba(var(--pri),.26) !important;box-shadow:0 6px 22px rgba(var(--pri),.10)}
.cr-steps .card-hd{margin-bottom:6px}
.cr-steps-bar{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.seg-b{
  appearance:none;border:1px solid var(--line);background:rgba(var(--ink),.05);color:var(--text3);
  font:inherit;font-size:10.5px;padding:3px 9px;border-radius:7px;cursor:pointer;transition:.15s;
}
.seg-b i{font-style:normal;opacity:.65;margin-left:3px}
.seg-b:hover{color:var(--text2);border-color:var(--line2)}
.seg-b.on{background:rgba(var(--pri),.16);border-color:rgba(var(--pri),.34);color:var(--info-12);font-weight:600}
#v-recon.on .cr-steps{flex:0 0 auto;max-height:46%;display:flex;flex-direction:column;min-height:0}
#v-recon.on .cr-steps .tbl-wrap{flex:1 1 auto;min-height:0}
/* 明细未展开时主表按内容定高：否则 7 行的表撑满整屏，卡里空出一大片。
   展开后主表不再是最后一个子元素，这条规则自动失效，回到「主表 + 明细」共用高度。 */
#v-recon.on #ledgerBody > .cr-flow-card:last-child{flex:0 1 auto}

/* ---------- 对账台簿 ---------- */
.lfbook{display:grid;grid-template-columns:0.92fr 1.35fr;gap:10px;flex:1 1 auto;min-height:0}
.lg-book-chart,.lg-book-tbl{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:11px 13px}
.lg-book-chart .chart{flex:1 1 auto;height:0;min-height:120px}
.lg-book-tbl .tbl-wrap{flex:1 1 auto;min-height:0}
.lg-book-tbl .pager{flex:0 0 auto;padding:7px 0 0;border-top:1px solid var(--line);margin-top:4px}
.book-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text3);
  margin-top:5px;white-space:nowrap}
.book-foot .btn{margin-left:auto}

/* ---------- 通用：页内说明条 / 操作条 ---------- */
.ctl-note{
  font-size:11px;line-height:1.75;color:var(--text2);padding:8px 12px;border-radius:9px;
  background:rgba(var(--pri),.07);border:1px solid rgba(var(--pri),.18);margin-bottom:10px;
}
.ctl-note b{color:var(--text)}
.ctl-note code{font-family:var(--mono,monospace);font-size:10.5px;color:var(--cyan-ink)}
.cr-bar{
  display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;
}
.cr-bar-t{font-size:10.5px;color:var(--text3)}
.cr-bar-t b{color:var(--text2)}
.cr-bar .btn{margin-left:0}
.cr-bar > .btn:last-child{margin-left:auto}

/* ---------- 审计控制：表单与配置 ---------- */
.ctl-kpi{margin-bottom:10px}
.ctl-list{margin-bottom:10px}
.ctl-list .card-hd{margin-bottom:8px}
.ctl-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fld-input{
  height:27px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);
  background:rgba(var(--ink),.05);color:var(--text);font:inherit;font-size:11px;min-width:120px;
}
.fld-input:focus{outline:none;border-color:rgba(var(--pri),.45);background:rgba(var(--pri),.07)}
.ctl-editor{padding:12px 14px}
.ctl-editor .card-hd{flex-wrap:wrap;gap:4px 8px}
.ctl-editor .card-sub{margin-left:auto}
.ctl-form{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 150px}
.fld.wide{flex:1 1 100%}
.fld > span{font-size:10px;color:var(--text3)}
.fld input,.fld select,.fld textarea{
  height:29px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);
  background:rgba(var(--ink),.05);color:var(--text);font:inherit;font-size:11.5px;
}
.fld textarea{height:auto;padding:7px 9px;line-height:1.55;font-family:var(--mono,monospace);font-size:10.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:rgba(var(--pri),.45);background:rgba(var(--pri),.07)}
.fld input[readonly]{color:var(--text2);background:rgba(var(--ink),.02)}
.ctl-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px}
.ctl-hint{font-size:9.8px;color:var(--text3);line-height:1.5}
.ic-sha{font-style:normal;font-size:10px;color:var(--text3);padding-top:2px;word-break:break-all}
.cmd-box{margin-top:9px;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:rgba(var(--ink),.05)}
.cmd-hd{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text2);
  padding:6px 10px;border-bottom:1px solid var(--line);background:rgba(var(--ink),.04)}
.cmd-hd .btn{margin-left:auto}
.cmd-hd .btn + .btn{margin-left:4px}
.cmd-box pre{margin:0;padding:8px 10px;font-family:var(--mono,monospace);font-size:10px;
  color:var(--text2);white-space:pre-wrap;word-break:break-all;line-height:1.6}
.cmd-box pre + pre{border-top:1px dashed var(--line)}
.ic-edit{display:grid;grid-template-columns:1.02fr 0.98fr;gap:10px}

/* ---------- 执行监测：异常执行卡 ---------- */
.abn-card{margin-bottom:10px;padding:11px 13px}
.abn-card .card-hd{margin-bottom:6px}
.abn-wrap{max-height:186px}
.abn-ok{font-size:11px;color:var(--ok-11);padding:6px 2px 2px}
.abn-more{font-size:10px;color:var(--text3);padding-top:4px}

/* ---------- 回收调整：把原台账的栅格宽度带过来 ---------- */
#v-control-recycle .anom-kpi{margin-bottom:10px}
#v-control-recycle .anom-grid{display:grid;grid-template-columns:0.95fr 1.55fr;gap:10px}
#v-control-recycle .anom-grid > .card{min-height:340px;display:flex;flex-direction:column}
#v-control-recycle .anom-rules{max-height:420px;overflow-y:auto;padding-right:4px}

/* ==================== v3.2 全站一屏 ====================
   这一版把「允许整页滚动」的两页（审计控制的表单页、运营分析）也收进一屏。
   做法不是把字号缩小，而是：
     1) 页面本身变成定高的栅格（grid），行高按内容重要性分配；
     2) 每张卡片自己是个 flex 列，长表格在卡片内部滚动；
     3) 能合并的区块合并（层级切换条塞进卡片头、口径说明降为脚注）。
   这样「不滚动」是真的不滚动，而不是靠 overflow:hidden 把内容偷偷切掉。 */
#viewWrap.fit .view.on{overflow:hidden}

/* ---------- 审计控制 · 执行监测 ----------
   v3.3 重排：消耗构成 / 四类不可见执行 / 技能调用 / 隐藏调用明细四块全部撤掉，
   页面只剩「异常 → 记录」两件事，于是空间重新分配：
     行1 横幅 · 行2 四个指标 + 定时任务配置（同一行、等高） · 行3 异常 · 行4 记录(伸缩) */
#v-control-exec.on{
  display:grid;height:100%;min-height:0;gap:10px;
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
}
#v-control-exec.on > *{min-width:0}

/* 指标（左）+ 定时任务配置（右）：外层拉伸保证等高，
   内层一个居中、一个可滚 —— 「高度一致、垂直居中」靠的是这两句，不是估数字 */
.exec-top{display:grid;gap:10px;min-height:0;
  grid-template-columns:minmax(0,1.52fr) minmax(0,.96fr);align-items:stretch}
.exec-kpis{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;min-height:0}
.exec-kpis .kpi{height:100%;display:flex;flex-direction:column;justify-content:center}
.exec-kpis .kpi-v{font-size:19px}
.exec-cfg{overflow:hidden}
.exec-cfg .cfg-entry{margin-bottom:8px}
.exec-cfg .cfg-list{overflow:auto}

/* 执行记录：页签行固定，表格在卡片内滚，分页条贴底 */
.exec-rec{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:11px 13px}
.exec-rec .card-hd{flex:0 0 auto;margin-bottom:8px}
.exec-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:8px}
.exec-tip{font-size:10.5px;color:var(--text3)}
.exec-tbl{flex:1 1 auto;min-height:0;overflow:auto;max-height:none}
.exec-rec > .pager{flex:0 0 auto;padding:8px 0 0;border-top:1px solid var(--line);margin-top:6px}
.exec-empty{text-align:center;color:var(--text3);padding:22px}

/* 执行明细弹窗里的技能链 */
.ex-sk{display:flex;flex-wrap:wrap;gap:8px}
.ex-sk-i{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line);background:rgba(var(--ink),.04)}
.ex-sk-i b{font-size:11.5px}
.ex-sk-i em{font-style:normal;font-size:10.5px;color:var(--text3)}

/* ---------- 审计控制 · 回收调整 ---------- */
#v-control-recycle.on{
  display:grid;height:100%;min-height:0;gap:10px;
  grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
}
#v-control-recycle.on > *{min-width:0}
#v-control-recycle .anom-grid{min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr);
  align-items:stretch}
#v-control-recycle .anom-grid > .card{min-height:0;height:100%;overflow:hidden;
  display:flex;flex-direction:column}
/* 右列只剩「事件列表 + 补偿预留」两张：列表吃掉剩余高度，补偿卡按内容高 */
#v-control-recycle .anom-right{
  min-height:0;height:100%;overflow:hidden;display:grid;
  grid-template-rows:minmax(0,1fr);gap:10px;
}
/* 补偿预留是卡片脚的一行说明，不是独立板块 */
.rsv-line{flex:0 0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--text3)}
.rsv-line b{color:var(--text2)}
.rsv-line em{font-style:normal;flex:1 1 260px;min-width:0;line-height:1.5}
.rsv-line .btn{flex:0 0 auto}
#v-control-recycle .anom-right > .card:first-child{display:flex;flex-direction:column;overflow:hidden}
#v-control-recycle .anom-grid > .card > .anom-rules{flex:1 1 auto;min-height:0;max-height:none;overflow:auto}
#v-control-recycle .anom-grid > .card > .tbl-wrap{flex:1 1 auto;min-height:0;overflow:auto;max-height:none}
#v-control-recycle .anom-chips{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:7px}
/* 与左侧引擎同高：表格在剩余空间里垂直居中，行高固定 30px，
   这样 10 行正好铺满一屏，条数不足时也不会被拉成一行一根 */
#v-control-recycle .anom-rank{display:flex;flex-direction:column}
#v-control-recycle .anom-rank > table{margin-block:auto}
#v-control-recycle .anom-rank tbody td{padding-top:4px;padding-bottom:4px}
#v-control-recycle .anom-right .pager{flex:0 0 auto;border-top:1px solid var(--line);padding:5px 0 0;gap:6px}
.sub-num{font-size:9.5px;color:var(--text3);font-weight:400;white-space:nowrap}
.anom-count{flex:0 0 auto;font-size:10.5px;color:var(--text3);padding:7px 0 0;
  border-top:1px solid var(--line)}

/* ---------- 运营分析：3 列 × 4 行仪表盘 ----------
   阅读顺序按「先结论后依据」：模式 → 模型 → 单层级 → 建议/路由。
   矩阵与时长两张图各占一格里的一整块，图高由 grid 决定（不再写死 276px）。 */
#v-analysis.on{
  display:grid;height:100%;min-height:0;gap:10px;
  /* 两列而不是三列：模型表有 11 列，挤在 1/3 宽度里只能靠截断表头，
     而截断的表头等于没有表头。分成两列后每列都拿得到 600px 以上。 */
  grid-template-columns:minmax(0,1.16fr) minmax(0,.84fr);
  grid-template-rows:minmax(0,.98fr) minmax(0,.92fr) minmax(0,.92fr) minmax(0,.98fr);
  grid-template-areas:
    "mode    model"
    "matrix  time"
    "rec     track"
    "route   route";
}
#v-analysis.on > .am-cell{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#v-analysis.on > .am-mode{grid-area:mode}
#v-analysis.on > .am-model{grid-area:model}
#v-analysis.on > .am-matrix{grid-area:matrix}
#v-analysis.on > .am-time{grid-area:time}
#v-analysis.on > .am-rec{grid-area:rec}
#v-analysis.on > .am-track{grid-area:track}
#v-analysis.on > .am-route{grid-area:route}
#v-analysis.on > .am-cell > .card{
  flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;
}
/* 图表卡例外：图不能被卡片滚动条挤压，高度交给 grid，图自己 resize */
#v-analysis.on > .am-cell > .am-chart-card{overflow:hidden}
/* 需要整卡滚动的两格：内容条数跟随数据变化，不硬切 */
#v-analysis.on .am-scroll > .card{overflow:auto}
#v-analysis.on .am-chart-card > .chart{flex:1 1 auto;min-height:0;height:auto !important}
#v-analysis.on .am-model .tbl-wrap{flex:1 1 auto;min-height:0;overflow:auto;max-height:none}
#v-analysis.on .am-mode .am-modes{flex:0 0 auto}
#v-analysis.on .am-mode .am-adv{flex:1 1 auto;min-height:0;overflow:auto}
/* 卡片标题优先占位：副标题是补充说明，宽度不够时它先让路（而不是把标题截成「模型运...」） */
#v-analysis.on .am-cell .card-hd{gap:8px}
#v-analysis.on .am-cell .card-title{flex:1 1 auto;min-width:6em}
#v-analysis.on .am-cell .card-sub{flex:0 1 auto;min-width:0}
#v-analysis.on .am-model .tbl{font-size:10.7px}
#v-analysis.on .am-model .tbl th{font-size:10px}
/* 三档建议在 2 列布局下横向空间足够，改成每档整行更耐读 */
.am-tiers{grid-template-columns:repeat(3,1fr)}
.am-tiers .rec + .rec{margin-top:6px}

/* 层级切换条：一行之内把「层级 / 快速切 / 候选模型 / 导出」全放下 */
.am-levelbar{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-top:6px;
  padding-top:7px;border-top:1px dashed var(--line)}
.am-levelbar .sel{height:24px;font-size:11px;padding:0 6px;flex:0 0 auto}
.am-levelbar .seg{flex:0 0 auto}
.am-levelbar .seg button{height:24px;padding:0 8px;font-size:11px}
.am-chips{display:flex;gap:4px;overflow:hidden;min-width:0;flex:1 1 auto}
.am-chips .tag{flex:0 0 auto}
.am-chips .dotm{margin-right:3px}

.am-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}
.am-tiers .tier{min-height:0;overflow:auto;padding:9px 10px}
.am-tiers .rec-d{font-size:10.4px;line-height:1.6}
.am-tiers .rec-t{font-size:11.4px}
.am-routes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:1 1 auto;min-height:0;overflow:auto}
.am-routes .route{padding:9px 10px}
.am-routes .route-main{font-size:10.5px;line-height:1.62;flex:0 0 auto}
.am-routes .route{display:flex;flex-direction:column;overflow:auto}
.am-routes .route-hd{margin-bottom:5px}
.am-routes .route-ft{margin-top:6px;padding-top:6px;font-size:10px}
.am-note{flex:0 0 auto;margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);
  font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:help}
.am-note b{color:var(--text2)}

/* ==================== v3.3 交互件 ====================
   这一版新增的东西都是「控件语义」，不是装饰：
   可点的规则卡、可删可停的任务行、留痕链与比对结论。 */

/* 审计引擎：规则卡是筛选器，必须一眼看出「现在按哪条筛」 */
.rule{cursor:pointer;position:relative}
.rule.on{border-color:rgba(var(--pri),.55);background:rgba(var(--pri),.1);
  box-shadow:0 0 0 1px rgba(var(--pri),.22) inset}
.rule.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;
  border-radius:2px;background:var(--info-9)}
.rule.on .rule-name{color:var(--info-12)}
.rule:focus-visible{outline:2px solid rgba(var(--pri),.5);outline-offset:2px}

/* 任务列表操作列：编辑 / 删除 / 启停 三件并排，**每一行都一样**。
   系统任务与普通任务的区别在「能不能真的执行」，不在「有没有这个按钮」——
   少给一个按钮，用户只会以为漏做了；给了再解释，才是把限制说清楚。 */
.ts-ops{display:flex;align-items:center;gap:4px}
.ts-ops .switch{margin-left:2px}
.icob{width:24px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text3);
  cursor:pointer;padding:0;transition:.14s;flex:0 0 24px}
.icob:hover{color:var(--text);border-color:var(--line2);background:var(--hover)}
.icob:focus-visible{outline:2px solid rgba(var(--pri),.5);outline-offset:1px}
.icob.danger:hover{color:var(--bad-11);border-color:rgba(255,107,107,.45);
  background:rgba(255,107,107,.12)}
.icob svg{width:12px;height:12px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.btn.danger{color:var(--bad-11);border-color:rgba(255,107,107,.32)}
.btn.danger:hover{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.5)}
/* .switch 原来是给 div 用的，这里复用到 button 上：去掉原生按钮外观 */
button.switch{border:none;padding:0;appearance:none;-webkit-appearance:none}
button.switch:focus-visible{outline:2px solid rgba(var(--pri),.5);outline-offset:2px}
/* 停用的行整体压暗一档：列表里「哪条不跑」要能扫出来，而不是逐个读状态标签 */
tr.is-off .name{color:var(--text3)}
tr.is-off td{color:var(--text3)}
tr.is-off .tag.gray{opacity:.85}
tr.is-custom .name:after{content:'本机新建';margin-left:6px;font-size:9px;color:var(--info-11);
  border:1px solid rgba(var(--pri),.35);border-radius:4px;padding:0 4px;vertical-align:1px}
/* 系统任务：由任务计划程序按点拉起，页面只能改配置、启停要同步到系统 */
tr.is-system .name:after{content:'系统任务';margin-left:6px;font-size:9px;color:var(--ok-11);
  border:1px solid rgba(80,205,137,.4);border-radius:4px;padding:0 4px;vertical-align:1px}
.ts-state .tag + .tag{margin-left:4px}

/* 弹窗里的多行输入 */
.cfg-ta{flex:1 1 auto;min-width:0;min-height:46px;resize:vertical;padding:5px 8px;
  background:var(--hover);border:1px solid var(--line2);border-radius:7px;
  color:var(--text);font:inherit;font-size:12px;line-height:1.6;outline:none}
.cfg-ta:focus{border-color:rgba(var(--pri),.5)}

/* 收入：比对结论 + 哈希链留痕 */
.ic-cmp{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin:8px 0 2px;
  padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(var(--ink),.04)}
.ic-cmp.ok{border-color:rgba(53,208,127,.34);background:rgba(53,208,127,.07)}
.ic-cmp.bad{border-color:rgba(255,107,107,.34);background:rgba(255,107,107,.07)}
.ic-cmp.warn{border-color:rgba(240,182,90,.34);background:rgba(240,182,90,.07)}
.ic-cmp-t{flex:1 1 220px;min-width:0;font-size:11px;line-height:1.6;color:var(--text2)}
.ic-cmp-t b{color:var(--text)}
.ic-cmp-m{flex:1 1 100%;font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}

.ic-trail-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:10px 0 5px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:10.5px;color:var(--text3)}
.ic-trail-hd em{font-style:normal;color:var(--text2)}
.ic-trail{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ic-trail .tbl td{padding-top:4px;padding-bottom:4px}
.ic-trail-empty{font-size:10.8px;color:var(--text3);line-height:1.7;padding:9px 10px;
  border:1px dashed var(--line2);border-radius:8px;background:rgba(var(--ink),.03)}
.ic-chain-ok{color:var(--ok-11);font-weight:600}
.ic-chain-bad{color:var(--bad-11);font-weight:600}
.ic-sha{display:block;font-style:normal;font-size:10px;color:var(--text3);
  font-family:var(--mono);margin-top:3px;word-break:break-all}

/* ---------- 任务设置 / 收入配置：表单页也吃掉整屏 ----------
   这两页过去是「内容多高就多高」，剩下的空白全留在下面；既然已经 fit 到一屏，
   就让列表吃掉剩余高度，而不是让内容浮在页面顶部。 */
#v-control-task.on,#v-control-income.on{
  display:grid;height:100%;min-height:0;gap:10px;align-content:start;
}
#v-control-task.on{grid-template-rows:auto auto minmax(0,1fr)}
#v-control-income.on{grid-template-rows:auto auto minmax(0,1fr) auto}
#v-control-task.on > *,#v-control-income.on > *{min-width:0}
#v-control-task.on .ctl-kpi,#v-control-income.on .ctl-kpi{margin-bottom:0}
#v-control-task.on .ctl-list,#v-control-income.on .ctl-list{
  margin-bottom:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#v-control-task.on .ctl-list > .tbl-wrap,#v-control-income.on .ctl-list > .tbl-wrap{
  flex:1 1 auto;min-height:0;overflow:auto;max-height:none}
#v-control-task.on .ctl-list > .pager,#v-control-income.on .ctl-list > .pager{flex:0 0 auto}
#v-control-income.on .ic-edit{align-self:start}

</style>
</head>
